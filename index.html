<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<meta name="viewport" content="width=device-width, initial-scale=1.0,
     interactive-widget=resizes-content">-->
    <title>loup garou</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <link rel="icon" type="image/x-icon" href="images/icons/icon-512x512.png">
</head>
<body>
    <div id="Accueil" style="display: none;">
        <div id="TheGame" class="container">
            <!-- Se choisir une icon-->
            <div class="select-icon-players">
                <button onclick="precPerso()" class="btn-rond"><</button>
                <div id="persoAcceuil" class="icon-perso"></div>
                <button onclick="nextPerso()"  class="btn-rond">></button>
            </div>

            <input type="text" id="nameInput" placeholder="Entrez votre nom">
            <button class="btn1" onclick="validerCode()">Rejoindre une salle</button>
            <button class="btn2", onclick="creerNouvellePartie()">creer une partie</button>
        </div>
        <form action="" id="EnterGame" class="container hidden-overlay">
            <input id="codeSalle" required>
            <span></span>
            <button onclick="EntrerCode(event)" class="btn1">Commencer la partie</button>
        </form>
    </div>
    <div id="salle-game" style="display: none;">
        <div id="parameter" class="btn-parameter">
            <button class="btn-icon", onclick="parametresJeu()">
                <img src="images/icons/parametres.png" alt="parametre">
            </button>
        </div>
        <div id="salle-attente-game">
            <div class="menu-lancer">
                <div class="exit-the-game">
                    <img src="images/icons/exit.png" alt=""> Quittez
                </div>
                <div class="pop-up-number-player">
                    <h5>Nombre de joueur connecté.. </h5>
                    <p id="numsPlayersConnected"> 0</p>
                </div>
                <button id="start" class="hidden-overlay" onclick="launch_game()">Lancer</button>
            </div>
            <input type="text" id="lien-a-copier" readonly>
            <button onclick="copierLien()">Copier le lien</button>
            <div id="usersalle">
                <div id="perso-grid">
                    
                </div>
                <center><span id="usersalle-nums"></span></center>
            </div>
        </div>
        <div class="wrapper-messagerie">
            <div id="messagerie" style="display: none;">
                <div id="messages"  tabindex="0"></div>
                <div class="space"></div>
                <div class="reference hidden-overlay" >
                    <span>roro</span>
                    <button onclick="hide_reference()">X</button>
                </div>
                <div class="input-area">
                    <input type="text" autocomplete="off" id="messageInput" placeholder="Ecrire votre message...">
                    <button id="send-button" n onclick="sendMessage()">
                        <img src="images/icons/send.png" alt="send">
                    </button>
                </div>
            </div>
            <div class="icon" id="see-msg" onclick="messagerie_visible()">
                <img src="images/icons/chat.png" alt="">
            </div>
            <div id="notification"><span></span></div>
        </div>
        <div id="salle-de-jeu-active">
           
        </div>
        <div id="barre-menu">
            <div id="theVotes" onclick="afficheTheVote()">
                <span class="emoji">✔️</span>
                <span id="listvote" onclick=""></span>
            </div>
            <div id="menu-carte">
                <div id="my-carte" onclick="afficheCarteMenu()"></div>
                <div id="liste-carte"></div>
            </div>
        </div>
       <!-- votes du villages pop-up -->
        <div class="wrapper-vote-village">
            <div class="div-vote">
                <span class="titre">Vote du jour</span>
                <span class="voter-elimination"> Votez pour eliminer un joueur!</span>
                <center>
                <input type="button" value="Se presenter" class="btn2 hidden-overlay " id="candidateMaire" onclick="candidateMaire()">
                </center>
                <span class="timer"></span>
                <ul class="liste-vote-du-village">
                </ul>
            </div>
        </div>

        <!--    transition que j'utilise meme pas mdr    -->
        <div id="transition-overlay" class="hidden-overlay">
            <div id="transition-message">Le village s'endort...</div>
        </div>

        <!-- popup de la sorciere   -->
        <div id="popup-sorciere" class="pop-up hidden-overlay">
            <div class="sorciere-card">
                <div class="content">
                    <p id="message-victime"></p>
                </div>
                <div class="actions">
                    <button id="btn-sauver" class="btn-potion" onclick="clickPotionSauver()"><img src="images/icons/fiolesoso.png" alt="fiole sorciere"></button>
                    <button id="btn-tuer" class="btn-potion" onclick="clickPotionTuer()"><img src="images/icons/fiolesoso.png" alt="fiole sorciere"></button>
                    <br>
                    <button id="btn-rien" class="btn-passer" onclick="neRienFaire()">Ne rien faire</button>
                </div>
            <div class="barre-progress"></div>
            </div>
        </div>
        <!--    fin     -->
        <!--    popup de vote-->
        <div class="pop-up-vote hidden-simple">
            <h3>Recapitulatif des votes</h3>
            <div class="emplacement-vote"></div>
        </div>
    
        <!--    popup timer  -->
        <div id="popup-timer" class="hidden-overlay">
            <div class="content-timer">
                <div></div>
                <div>
                    <p id="message-timer"></p>
                </div>
            </div>
        </div>
        <!--    fin     -->
                <!--    popup mort  -->
        <div id="popup-mort" class="pop-up hidden-overlay">
            <div>
                <p id="message-mort"></p>
            </div>
        </div>
        <!--    fin     -->

        <!--     fin du jeu    -->
        <div id="game-over" class="pop-up hidden-overlay">
            <div class="pop-up-end-game bleu">
                <span class="over"></span>
            </div>
        </div>

        <!--        dashboard du parametre du jeu   -->
        <div id="parametre-role" class="wrapper-parameter hidden-simple">
            <div class="center"><span>volume </span>
                <input type="range" class="volume-bar">
            </div>
            <div class="nombrePlayers"> 
                <p>Nombres de joueurs</p>
                <div class="select-number-players">
                    <button onclick="prec()"><</button>
                    <span id="precNumber"></span>
                    <div id="nowNumber"></div>
                    <span id="nextNumber"></span>
                    <button onclick="next()">></button>
                </div>
                <span></span>
            </div>
            <div id="composition">
                <p><strong>composition</strong></p>
                <div id="composition-role">
                </div>
            </div>
        </div>
    
    </div>


    <!-- vote du village-->
    <template id="template-vote-du-village">
        <li class="player-item">
            <div></div>
            <span class="name"></span>
            <span class="votes"></span>
        </li>
    </template>

    <!--        icon du personnage    -->
        <template id="template-icon-perso">
            <div>
                <div class="icon-perso"></div>
                <span class="perso-span"></span>
            </div>
        </template>

    <!-- template vote contre vote pour -->
     <template id="template-voteFor">
        <div class="container-vote">
            <div class="vote-counter">
                <span id="span1Vote"></span>
                <div class="container-anim">
                    <div id="badge" class="animate-vote">
                        <div class="voteBy">
                            <span>🗡️</span>
                        </div>
                    </div>
                </div>
                <span id="span2Vote"></span>
            </div>
        </div>
     </template>
    <!-- special message-->
     <template id="template-special-message">
        <div id="wrapper-special-message">
            <div class="circle">
            <span>!</span>
            </div>
            <div class="pop-up-message">
                <p id="special-message"></p>
            </div>
        </div>
     </template>

     <!-- template pour message de choix --->
    <template id="template-eliminate-candidate">
        <div id="eliminate-candidate" >
            <span id="titreChoixDuMaire">Eliminez un candidat</span>
            <div class="list-perso">
          <!--      <div class="candidate"> <div class="icon-perso"></div> <span>roro</span></div>-->
            </div>
            <span class="timerMaire"></span>
        </div>
    </template>
    
    <!-- lire la carte du joueur -->
        <template id="template-carte">
            <div class="flip-card" onclick="this.classList.toggle('flipped')">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <p class="bas">Cliquez pour lire le rôle!</p>
                    </div>
                    <div class="flip-card-back">
                        <h2 class="card-name"></h2>
                        <p class="card-description"></p>
                    </div>
                </div>
            </div>
        </template>
<!--    template pour les informations genre voyante etc...    -->
    <template id="template-information">
        <div id="information">
            <div> <span id="text-information"></span></div>
            <div class="information-icon"></div>
            <button onclick="hide_information()">Se rendormir</button>
        </div>
    </template>

<!--        template pour les roles des personnages -->
    <template id="template-role">
        <div class="section-perso">
            <button class="btn-role">-</button>
            <div class="icon-perso"></div>
            <div class="icon-mark">?</div>
            <div id="info-role">
                <h3></h3>
                <span></span>
            </div>
            <button class="btn-role">+</button>
            <span>3</span>
        </div>
    </template>
</body>
</html>
<script src="js.js"></script>
<script src="client.js"></script>
<script src="dataClient.js"></script>
<script src="audio.js"></script>
</body>
</html>
